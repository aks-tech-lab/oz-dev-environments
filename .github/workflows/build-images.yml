name: Build and Push GHCR Image

on:
  push:
    branches:
      - MASTER
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aks-tech-lab/oz-dev-environments

jobs:
  build-matrix:
    name: ghcr.io/aks-tech-lab/oz-dev-environments:${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - DuckOS
          - latest
          - pre-build
          - release

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_CODESPACE_PAT_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          build-args: |
            INSTALL_RUST=false
            INSTALL_GO=false
            INSTALL_JAVA=false
            INSTALL_DOTNET=false
            INSTALL_RUBY=false
            INSTALL_BROWSERS=false
            INSTALL_CODING_AGENTS=false
            NODE_VERSION=24.0.0
            GO_VERSION=1.23.4
            RUST_VERSION=1.83.0
            JAVA_VERSION=21
            DOTNET_VERSION=8.0
            RUBY_VERSION=3.3
            LANGUAGES=
          cache-from: type=gha
          cache-to: type=gha,mode=max
